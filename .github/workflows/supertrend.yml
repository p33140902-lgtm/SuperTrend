name: Supertrend Notifier

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependensi
        run: pip install yfinance pandas numpy requests

      - name: Jalankan bot
        run: python bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SYMBOL: ${{ vars.SYMBOL }}
          INTERVAL: ${{ vars.INTERVAL }}
          FACTOR: ${{ vars.FACTOR }}
          ATR_LEN: ${{ vars.ATR_LEN }}

      - name: Simpan state
        run: |
          git config user.name "supertrend-bot"
          git config user.email "supertrend-bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || (git commit -m "update state" && git push)
